<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pedalboard Planner — Add Pedal Wizard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F5F5F5; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }

.phone { background: #E0E0E0; border-radius: 12px; padding: 12px; }
.screen { background: #fff; border-radius: 8px; border: 0.5px solid #E0E0E0; overflow: hidden; display: flex; flex-direction: column; height: 600px; width: 366px; }
.top-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 8px; flex-shrink: 0; }
.top-title { font-size: 14px; font-weight: 500; color: #111; }
.top-x { font-size: 22px; color: #AAA; cursor: pointer; line-height: 1; padding: 0 2px; }
.top-x:hover { color: #111; }
.progress { display: flex; gap: 4px; padding: 0 16px 10px; flex-shrink: 0; }
.pip { height: 2px; flex: 1; border-radius: 1px; background: #E0E0E0; }
.pip.active { background: #378ADD; }
.body { flex: 1; overflow-y: auto; padding: 0 16px; }
.step { display: none; padding-bottom: 8px; }
.step.active { display: block; }
.step-heading { font-size: 16px; font-weight: 500; color: #111; margin-bottom: 4px; margin-top: 4px; }
.step-sub { font-size: 13px; color: #666; margin-bottom: 16px; }
.bottom-nav { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-top: 0.5px solid #E0E0E0; flex-shrink: 0; gap: 10px; }
.btn-back { font-size: 14px; color: #666; cursor: pointer; padding: 10px 0; min-width: 60px; }
.btn-back:hover { color: #111; }
.btn-back.invisible { visibility: hidden; }
.btn-next { flex: 1; padding: 12px; border-radius: 8px; border: none; font-size: 15px; font-weight: 500; cursor: pointer; background: #378ADD; color: #fff; }
.btn-next:disabled { background: #E0E0E0; color: #AAA; cursor: not-allowed; }
.btn-next:not(:disabled):hover { background: #2a6fb5; }

.image-drop { border: 1.5px dashed #CCC; border-radius: 8px; aspect-ratio: 16/9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; background: #F5F5F5; position: relative; overflow: hidden; margin-bottom: 12px; }
.image-drop:hover { border-color: #378ADD; }
.processing-bar { background: #F5F5F5; border-radius: 8px; padding: 12px; display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.processing-bar-inner { flex: 1; height: 4px; background: #E0E0E0; border-radius: 2px; overflow: hidden; }
.processing-bar-fill { height: 100%; background: #378ADD; border-radius: 2px; transition: width 0.25s; }

.field-group { margin-bottom: 14px; }
.field-label { font-size: 12px; color: #666; margin-bottom: 6px; display: block; }
.field-input { width: 100%; font-size: 14px; padding: 10px 12px; border-radius: 8px; border: 0.5px solid #CCC; background: #F5F5F5; color: #111; }
.field-input:focus { outline: none; border-color: #378ADD; }
.dim-row { display: flex; align-items: center; gap: 6px; }
.dim-input { width: 56px; flex-shrink: 0; font-size: 14px; padding: 10px 8px; border-radius: 8px; border: 0.5px solid #CCC; background: #F5F5F5; color: #111; text-align: center; }
.dim-input:focus { outline: none; border-color: #378ADD; }
.dim-unit { font-size: 13px; color: #AAA; white-space: nowrap; }
.lookup-link { font-size: 11px; color: #378ADD; white-space: nowrap; text-decoration: none; margin-left: auto; }

.jack-section-label { font-size: 11px; font-weight: 500; color: #AAA; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; margin-top: 10px; }
.jack-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.jack-btn { padding: 9px 8px; border-radius: 8px; border: 1px solid #E0E0E0; background: #F5F5F5; font-size: 12px; color: #666; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.jack-btn.active { border-color: #378ADD; background: #E6F1FB; color: #185FA5; }
.jack-btn.active-midi { border-color: #D4537E; background: #FBEAF0; color: #72243E; }

.pedal-preview-wrap { background: #F5F5F5; border-radius: 8px; padding: 12px; display: flex; justify-content: center; align-items: center; margin-bottom: 12px; min-height: 86px; }
.pedal-preview-box { background: #4A148C; border-radius: 3px; position: relative; display: flex; align-items: center; justify-content: center; width: 86px; height: 86px; }
.jack-dot-audio { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: #378ADD; border: 1px solid rgba(255,255,255,0.5); }
.jack-dot-midi  { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: #D4537E; border: 1px solid rgba(255,255,255,0.5); }

.port-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.port-row { display: flex; align-items: center; gap: 8px; background: #F5F5F5; border-radius: 8px; padding: 10px 12px; }
.port-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.port-name { flex: 1; font-size: 13px; color: #111; }
.port-meta { font-size: 11px; color: #AAA; }
.add-port-btn { width: 100%; padding: 10px; border-radius: 8px; border: 1px dashed #CCC; background: transparent; color: #666; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.add-port-btn:hover { background: #F5F5F5; }
.preset-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.preset-chip { font-size: 11px; padding: 5px 10px; border-radius: 999px; border: 0.5px solid #CCC; cursor: pointer; color: #666; background: transparent; }
.preset-chip:hover { background: #F5F5F5; }

.review-img { width: 100%; aspect-ratio: 16/9; background: #4A148C; border-radius: 8px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; }
.review-card { background: #F5F5F5; border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
.review-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 5px 0; }
.review-row + .review-row { border-top: 0.5px solid #E0E0E0; }
.review-key { font-size: 12px; color: #AAA; padding-top: 1px; }
.review-val { font-size: 13px; color: #111; font-weight: 500; text-align: right; max-width: 58%; }

.sheet-wrap { background: #fff; border-radius: 8px; border: 0.5px solid #E0E0E0; margin-top: 8px; overflow: hidden; }
.sheet-title { font-size: 14px; font-weight: 500; color: #111; padding: 14px 14px 4px; }
.sheet-sub { font-size: 12px; color: #AAA; padding: 0 14px 10px; border-bottom: 0.5px solid #E0E0E0; }
.sheet-section { font-size: 10px; font-weight: 500; color: #AAA; text-transform: uppercase; letter-spacing: 0.06em; padding: 10px 14px 4px; }
.sheet-opt { display: flex; align-items: center; gap: 12px; padding: 10px 14px; cursor: pointer; }
.sheet-opt:hover { background: #F5F5F5; }
.sheet-opt-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.sheet-opt-name { font-size: 14px; color: #111; flex: 1; }
.sheet-back { display: flex; align-items: center; gap: 4px; font-size: 13px; color: #666; padding: 10px 14px; cursor: pointer; border-top: 0.5px solid #E0E0E0; }
.sheet-back:hover { color: #111; }
.conn-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px 14px; }
.conn-chip { font-size: 12px; padding: 6px 14px; border-radius: 999px; border: 0.5px solid #CCC; cursor: pointer; color: #666; background: transparent; }
.conn-chip:hover { background: #E6F1FB; border-color: #378ADD; color: #185FA5; }
</style>
</head>
<body>

<div class="phone">
  <div class="screen" id="screen">
    <div class="top-bar">
      <span></span>
      <span class="top-title" id="topTitle">Add pedal</span>
      <span class="top-x" onclick="cancelFlow()" aria-label="Cancel">×</span>
    </div>
    <div class="progress" id="progress"></div>
    <div class="body" id="body"></div>
    <div class="bottom-nav">
      <span class="btn-back invisible" id="btnBack" onclick="goBack()">
        <i class="ti ti-chevron-left" style="font-size:14px;vertical-align:-1px"></i> Back
      </span>
      <button class="btn-next" id="btnNext" onclick="goNext()" disabled>Continue</button>
    </div>
  </div>
</div>

<script>
let step = 0;
let imageReady = false;
let processingTimer = null;
let audioJacks = { right:true, left:true, top:false, bottom:false };
let midiJacks  = { right:false, left:false, top:false, bottom:false };
let ports = [];
let pickingRole = false;
let pendingRoleId = null;

const STEPS = ['Image','Name & size','Jack Placement','Connections','Review'];

const ROLES = [
  { id:'input',      label:'Input',         color:'#378ADD', group:'Audio' },
  { id:'output',     label:'Output',        color:'#66BB6A', group:'Audio' },
  { id:'input_l',    label:'Input L',       color:'#378ADD', group:'Audio' },
  { id:'input_r',    label:'Input R',       color:'#5DCAA5', group:'Audio' },
  { id:'output_l',   label:'Output L',      color:'#66BB6A', group:'Audio' },
  { id:'output_r',   label:'Output R',      color:'#5DCAA5', group:'Audio' },
  { id:'stereo_in',  label:'Stereo input',  color:'#378ADD', group:'Audio' },
  { id:'stereo_out', label:'Stereo output', color:'#66BB6A', group:'Audio' },
  { id:'fx_send',    label:'FX send',       color:'#EF9F27', group:'Audio' },
  { id:'fx_return',  label:'FX return',     color:'#EF9F27', group:'Audio' },
  { id:'expression', label:'Expression',    color:'#888780', group:'Control' },
  { id:'remote',     label:'Remote',        color:'#888780', group:'Control' },
  { id:'cv',         label:'CV',            color:'#639922', group:'Control' },
  { id:'midi_in',    label:'MIDI in',       color:'#D4537E', group:'MIDI' },
  { id:'midi_out',   label:'MIDI out',      color:'#D4537E', group:'MIDI' },
];

const CONNECTORS = {
  Audio:   ['TS (mono)', 'TRS', 'XLR'],
  Control: ['TS (mono)', 'TRS'],
  MIDI:    ['DIN 5-pin', 'TRS (MIDI)'],
};

// These roles have implied connectors — skip the connector picker
const IMPLIED = {
  input_l:'TS (mono)', input_r:'TS (mono)',
  output_l:'TS (mono)', output_r:'TS (mono)',
  stereo_in:'TRS', stereo_out:'TRS',
};

function connShort(c) {
  return {['TS (mono)']:'TS','TRS':'TRS','XLR':'XLR',['DIN 5-pin']:'DIN',['TRS (MIDI)']:'TRS'}[c]||c;
}

function buildProgress() {
  const p = document.getElementById('progress'); p.innerHTML='';
  STEPS.forEach((_,i)=>{ const d=document.createElement('div'); d.className='pip'+(i<=step?' active':''); p.appendChild(d); });
}

function updateNav() {
  document.getElementById('topTitle').textContent = STEPS[step];
  document.getElementById('btnBack').classList.toggle('invisible', step===0);
  const next = document.getElementById('btnNext');
  next.textContent = step===STEPS.length-1 ? 'Submit' : 'Continue';
  next.disabled = !canProceed();
}

function canProceed() {
  if(step===0) return imageReady;
  if(step===1) {
    const b=document.getElementById('brandInput')?.value.trim();
    const m=document.getElementById('modelInput')?.value.trim();
    const w=document.getElementById('widthInput')?.value;
    const d=document.getElementById('depthInput')?.value;
    return !!(b&&m&&w&&d);
  }
  if(step===2) return true;
  if(step===3) return ports.length>0;
  return true;
}

function goNext() {
  if(!canProceed()) return;
  if(step===STEPS.length-1){ submitPedal(); return; }
  pickingRole=false; pendingRoleId=null; step++; render();
}
function goBack() {
  if(step===0) return;
  pickingRole=false; pendingRoleId=null; step--; render();
}
function cancelFlow() {
  step=0; imageReady=false; ports=[];
  audioJacks={right:true,left:true,top:false,bottom:false};
  midiJacks={right:false,left:false,top:false,bottom:false};
  pickingRole=false; pendingRoleId=null; render();
}

function render() {
  buildProgress(); updateNav();
  const body=document.getElementById('body'); body.innerHTML='';
  const el=document.createElement('div'); el.className='step active'; body.appendChild(el);
  [s0,s1,s2,s3,s4][step](el);
}

function pedalSvg(){ return 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="240" height="135" viewBox="0 0 240 135"><rect width="240" height="135" rx="6" fill="%234A148C"/><rect x="20" y="18" width="200" height="16" rx="3" fill="rgba(255,255,255,0.12)"/><circle cx="50" cy="100" r="20" fill="rgba(255,255,255,0.08)"/><circle cx="120" cy="100" r="20" fill="rgba(255,255,255,0.08)"/><circle cx="190" cy="100" r="20" fill="rgba(255,255,255,0.08)"/><text x="120" y="68" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.35)" text-anchor="middle">pedal image</text></svg>'; }

function s0(el) {
  el.innerHTML=`
    <div class="step-heading">Add an image</div>
    <div class="step-sub">Use a top-down photo from the manufacturer's site.</div>
    <div class="image-drop" id="imgDrop" onclick="simulateUpload()">
      <img id="imgPreview" src="" style="display:none;width:100%;height:100%;object-fit:contain;"/>
      <div id="imgPlaceholder" style="text-align:center;">
        <i class="ti ti-photo-up" style="font-size:32px;color:#AAA;display:block;margin-bottom:8px;"></i>
        <div style="font-size:13px;color:#666;">Tap to choose a photo</div>
        <div style="font-size:11px;color:#AAA;margin-top:2px;">JPG or PNG, any resolution</div>
      </div>
    </div>
    <div class="processing-bar" id="procBar" style="display:none">
      <i class="ti ti-wand" style="font-size:18px;color:#378ADD;flex-shrink:0"></i>
      <div style="flex:1">
        <div style="font-size:12px;color:#666;margin-bottom:6px;" id="procLabel">Preparing…</div>
        <div class="processing-bar-inner"><div class="processing-bar-fill" id="procFill" style="width:0%"></div></div>
      </div>
    </div>
    <div id="imgHint" style="display:none;margin-top:4px;">
      <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:#666;">
        <i class="ti ti-check" style="font-size:16px;color:#1D9E75"></i>
        Background removed.
        <span style="color:#378ADD;cursor:pointer" onclick="simulateUpload()">Re-process</span>
      </div>
    </div>
  `;
  if(imageReady){
    document.getElementById('imgPlaceholder').style.display='none';
    document.getElementById('imgPreview').src=pedalSvg();
    document.getElementById('imgPreview').style.display='block';
    document.getElementById('imgHint').style.display='block';
  }
}

function simulateUpload(){
  document.getElementById('imgPlaceholder').style.display='none';
  document.getElementById('imgPreview').style.display='none';
  document.getElementById('imgHint').style.display='none';
  document.getElementById('procBar').style.display='flex';
  const fill=document.getElementById('procFill');
  const lbl=document.getElementById('procLabel');
  let pct=0; lbl.textContent='Downloading image model…';
  clearInterval(processingTimer);
  processingTimer=setInterval(()=>{
    pct+=Math.random()*10+4;
    if(pct>35&&pct<80) lbl.textContent='Removing background…';
    if(pct>=80) lbl.textContent='Finishing up…';
    fill.style.width=Math.min(pct,100)+'%';
    if(pct>=100){
      clearInterval(processingTimer);
      setTimeout(()=>{
        document.getElementById('procBar').style.display='none';
        document.getElementById('imgPreview').src=pedalSvg();
        document.getElementById('imgPreview').style.display='block';
        document.getElementById('imgHint').style.display='block';
        imageReady=true; updateNav();
      },300);
    }
  },120);
}

function s1(el){
  el.innerHTML=`
    <div class="step-heading">Name &amp; size</div>
    <div class="step-sub">Check the manufacturer's site for exact dimensions.</div>
    <div class="field-group">
      <label class="field-label">Brand</label>
      <input class="field-input" id="brandInput" type="text" placeholder="Stray Circuits" oninput="updateNav()"/>
    </div>
    <div class="field-group">
      <label class="field-label">Model name</label>
      <input class="field-input" id="modelInput" type="text" placeholder="Tortie Tude" oninput="updateNav()"/>
    </div>
    <div class="field-group">
      <label class="field-label">Width × depth (including all knobs and jacks)</label>
      <div class="dim-row">
        <input class="dim-input" id="widthInput" type="number" placeholder="2.6" step="0.1" min="0.5" oninput="updateNav()"/>
        <span class="dim-unit">×</span>
        <input class="dim-input" id="depthInput" type="number" placeholder="4.7" step="0.1" min="0.5" oninput="updateNav()"/>
        <span class="dim-unit">in</span>
        <a class="lookup-link" href="https://www.google.com" target="_blank">Look up <i class="ti ti-external-link" style="font-size:11px"></i></a>
      </div>
    </div>
  `;
}

function s2(el){
  el.innerHTML=`
    <div class="step-heading">Jack Placement</div>
    <div class="step-sub">Which sides have audio or MIDI jacks?</div>
    <div class="pedal-preview-wrap"><div class="pedal-preview-box" id="prevBox"></div></div>
    <div class="jack-section-label">Audio jacks</div>
    <div class="jack-row" id="audioRow"></div>
    <div class="jack-section-label" style="margin-top:10px;">MIDI jacks</div>
    <div class="jack-row" id="midiRow"></div>
    <div class="field-group" style="margin-top:12px;">
      <label class="field-label">Power jack side</label>
      <select class="field-input" id="powerJack">
        <option value="">— none / not sure</option>
        <option>Top</option><option>Right</option><option>Left</option><option>Bottom</option>
      </select>
    </div>
  `;
  buildJackBtns('audioRow',audioJacks,'audio');
  buildJackBtns('midiRow',midiJacks,'midi');
  refreshPreview();
}

function buildJackBtns(cid,state,type){
  const c=document.getElementById(cid); c.innerHTML='';
  [{id:'right',icon:'ti-arrow-bar-right',label:'Right'},{id:'left',icon:'ti-arrow-bar-left',label:'Left'},
   {id:'top',icon:'ti-arrow-bar-up',label:'Top'},{id:'bottom',icon:'ti-arrow-bar-down',label:'Bottom'}]
  .forEach(s=>{
    const b=document.createElement('div');
    b.className='jack-btn'+(state[s.id]?(type==='midi'?' active-midi':' active'):'');
    b.innerHTML=`<i class="ti ${s.icon}" style="font-size:15px"></i>${s.label}`;
    b.onclick=()=>{ state[s.id]=!state[s.id]; buildJackBtns(cid,state,type); refreshPreview(); };
    c.appendChild(b);
  });
}

function refreshPreview(){
  const box=document.getElementById('prevBox'); if(!box) return;
  box.innerHTML='<span style="font-size:9px;color:rgba(255,255,255,0.3)">top-down</span>';
  const pos={right:{right:'-4px',top:'50%',transform:'translateY(-50%)'},left:{left:'-4px',top:'50%',transform:'translateY(-50%)'},top:{top:'-4px',left:'50%',transform:'translateX(-50%)'},bottom:{bottom:'-4px',left:'50%',transform:'translateX(-50%)'}};
  Object.entries(audioJacks).forEach(([s,on])=>{ if(!on)return; const d=document.createElement('div'); d.className='jack-dot-audio'; Object.assign(d.style,pos[s]); box.appendChild(d); });
  Object.entries(midiJacks).forEach(([s,on])=>{ if(!on)return; const d=document.createElement('div'); d.className='jack-dot-midi'; const p={...pos[s]}; if(s==='right'||s==='left') p.top='28%'; Object.assign(d.style,p); box.appendChild(d); });
}

function s3(el){
  el.innerHTML=`
    <div class="step-heading">Connections</div>
    <div class="step-sub">Add every jack on this pedal.</div>
    <div class="preset-chips">
      <span class="preset-chip" onclick="addPreset('mono')">Mono in/out</span>
      <span class="preset-chip" onclick="addPreset('dual_mono')">Dual mono stereo</span>
      <span class="preset-chip" onclick="addPreset('trs_stereo')">TRS stereo</span>
      <span class="preset-chip" onclick="addPreset('fxloop')">+ FX loop</span>
      <span class="preset-chip" onclick="addPreset('midi')">+ MIDI in/out</span>
    </div>
    <div class="port-list" id="portList"></div>
    <button class="add-port-btn" onclick="showRolePicker()">
      <i class="ti ti-plus" style="font-size:16px"></i> Add connection
    </button>
    <div id="pickerArea"></div>
  `;
  renderPorts();
  if(pickingRole) showRolePicker(true);
  else if(pendingRoleId) showConnPicker(pendingRoleId,true);
}

function addPreset(type){
  if(type==='mono')       { addP('input','TS (mono)'); addP('output','TS (mono)'); }
  if(type==='dual_mono')  { addP('input_l','TS (mono)'); addP('input_r','TS (mono)'); addP('output_l','TS (mono)'); addP('output_r','TS (mono)'); }
  if(type==='trs_stereo') { addP('stereo_in','TRS'); addP('stereo_out','TRS'); }
  if(type==='fxloop')     { addP('fx_send','TS (mono)'); addP('fx_return','TS (mono)'); }
  if(type==='midi')       { addP('midi_in','DIN 5-pin'); addP('midi_out','DIN 5-pin'); }
  renderPorts(); updateNav();
}
function addP(roleId,connector){
  const role=ROLES.find(r=>r.id===roleId);
  ports.push({uid:Date.now()+Math.random(),roleId,connector,label:role.label,color:role.color});
}

function showRolePicker(skipScroll){
  pickingRole=true; pendingRoleId=null;
  const area=document.getElementById('pickerArea'); if(!area)return;
  area.innerHTML='';
  const wrap=document.createElement('div'); wrap.className='sheet-wrap';
  wrap.innerHTML='<div class="sheet-title">What type of connection?</div><div class="sheet-sub">Select the role this jack plays.</div>';
  ['Audio','Control','MIDI'].forEach(g=>{
    const sl=document.createElement('div'); sl.className='sheet-section'; sl.textContent=g; wrap.appendChild(sl);
    ROLES.filter(r=>r.group===g).forEach(role=>{
      const opt=document.createElement('div'); opt.className='sheet-opt';
      opt.innerHTML=`<div class="sheet-opt-dot" style="background:${role.color}"></div><div class="sheet-opt-name">${role.label}</div><i class="ti ti-chevron-right" style="font-size:14px;color:#AAA"></i>`;
      opt.onclick=()=>{
        if(IMPLIED[role.id]){ addP(role.id,IMPLIED[role.id]); pickingRole=false; pendingRoleId=null; document.getElementById('pickerArea').innerHTML=''; renderPorts(); updateNav(); }
        else { pickingRole=false; pendingRoleId=role.id; showConnPicker(role.id); }
      };
      wrap.appendChild(opt);
    });
  });
  const cancel=document.createElement('div'); cancel.className='sheet-back';
  cancel.innerHTML='<i class="ti ti-x" style="font-size:14px"></i> Cancel';
  cancel.onclick=()=>{ pickingRole=false; pendingRoleId=null; document.getElementById('pickerArea').innerHTML=''; };
  wrap.appendChild(cancel);
  area.appendChild(wrap);
  if(!skipScroll) setTimeout(()=>area.scrollIntoView({behavior:'smooth',block:'nearest'}),50);
}

function showConnPicker(roleId,skipScroll){
  pendingRoleId=roleId;
  const role=ROLES.find(r=>r.id===roleId);
  const conns=CONNECTORS[role.group];
  const area=document.getElementById('pickerArea'); if(!area)return;
  area.innerHTML='';
  const wrap=document.createElement('div'); wrap.className='sheet-wrap';
  wrap.innerHTML=`<div class="sheet-title">Connector type</div><div class="sheet-sub">What connector does the <strong style="font-weight:500">${role.label}</strong> jack use?</div>`;
  const chipsDiv=document.createElement('div'); chipsDiv.className='conn-chips';
  conns.forEach(c=>{
    const chip=document.createElement('span'); chip.className='conn-chip'; chip.textContent=c;
    chip.onclick=()=>{ addP(roleId,c); pickingRole=false; pendingRoleId=null; document.getElementById('pickerArea').innerHTML=''; renderPorts(); updateNav(); };
    chipsDiv.appendChild(chip);
  });
  wrap.appendChild(chipsDiv);
  const back=document.createElement('div'); back.className='sheet-back';
  back.innerHTML='<i class="ti ti-chevron-left" style="font-size:14px"></i> Back';
  back.onclick=()=>{ pendingRoleId=null; showRolePicker(); };
  wrap.appendChild(back);
  area.appendChild(wrap);
  if(!skipScroll) setTimeout(()=>area.scrollIntoView({behavior:'smooth',block:'nearest'}),50);
}

function renderPorts(){
  const list=document.getElementById('portList'); if(!list)return;
  list.innerHTML='';
  ports.forEach(p=>{
    const row=document.createElement('div'); row.className='port-row';
    row.innerHTML=`<div class="port-dot" style="background:${p.color}"></div><div class="port-name">${p.label}</div><div class="port-meta">${connShort(p.connector)}</div><i class="ti ti-x" style="font-size:16px;color:#AAA;cursor:pointer;margin-left:4px;" onclick="removePort(${p.uid})"></i>`;
    list.appendChild(row);
  });
  updateNav();
}
function removePort(uid){ ports=ports.filter(p=>p.uid!==uid); renderPorts(); updateNav(); }

function s4(el){
  const brand=document.getElementById('brandInput')?.value||'—';
  const model=document.getElementById('modelInput')?.value||'—';
  const w=document.getElementById('widthInput')?.value||'?';
  const d=document.getElementById('depthInput')?.value||'?';
  const aJ=Object.entries(audioJacks).filter(([,v])=>v).map(([k])=>k).join(', ')||'none';
  const mJ=Object.entries(midiJacks).filter(([,v])=>v).map(([k])=>k).join(', ')||'none';
  const ps=ports.length?ports.map(p=>`${p.label} (${connShort(p.connector)})`).join(', '):'—';
  el.innerHTML=`
    <div class="step-heading">Review</div>
    <div class="step-sub">Looks good? Hit submit to add to your library.</div>
    <div class="review-img"><span style="font-size:11px;color:rgba(255,255,255,0.35)">Pedal image</span></div>
    <div class="review-card">
      <div class="review-row"><span class="review-key">Brand</span><span class="review-val">${brand}</span></div>
      <div class="review-row"><span class="review-key">Model</span><span class="review-val">${model}</span></div>
      <div class="review-row"><span class="review-key">Dimensions</span><span class="review-val">${w}" × ${d}"</span></div>
      <div class="review-row"><span class="review-key">Audio jacks</span><span class="review-val">${aJ}</span></div>
      <div class="review-row"><span class="review-key">MIDI jacks</span><span class="review-val">${mJ}</span></div>
      <div class="review-row"><span class="review-key">Connections</span><span class="review-val" style="font-size:11px;line-height:1.5">${ps}</span></div>
    </div>
    <div style="font-size:12px;color:#AAA;text-align:center;padding:4px 0;">Also queues for community review.</div>
  `;
}

function submitPedal(){
  document.getElementById('screen').innerHTML=`
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;gap:14px;">
      <div style="width:56px;height:56px;border-radius:50%;background:#E1F5EE;display:flex;align-items:center;justify-content:center;">
        <i class="ti ti-check" style="font-size:28px;color:#1D9E75"></i>
      </div>
      <div style="font-size:18px;font-weight:500;color:#111;">Pedal added</div>
      <div style="font-size:13px;color:#666;">Now available in your library and queued for community review.</div>
      <button onclick="cancelFlow()" style="margin-top:8px;padding:12px 24px;border-radius:8px;border:0.5px solid #CCC;background:transparent;color:#666;font-size:14px;cursor:pointer;">Add another</button>
    </div>
  `;
}

render();
</script>
</body>
</html>
