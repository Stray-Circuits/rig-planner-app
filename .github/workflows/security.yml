name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 12:00 UTC — catches advisories filed against pinned deps.
    - cron: '0 12 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pnpm-audit:
    name: pnpm audit (production deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 11
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails on any "high" or "critical" advisory in production deps.
      # Dev-only advisories surface via Dependabot instead, to keep this
      # signal actionable.
      - name: pnpm audit
        run: pnpm audit --prod --audit-level=high

      # Enforces an AGPL-compatible license allowlist on production
      # deps. Config (allowed licenses + per-package exceptions) lives
      # in scripts/check-npm-licenses.mjs.
      - name: npm license check
        run: pnpm licenses:check

  cargo-deny:
    name: cargo-deny (advisories / licenses / bans / sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories bans licenses sources
          arguments: --all-features

  dependency-review:
    name: dependency-review (PR only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
