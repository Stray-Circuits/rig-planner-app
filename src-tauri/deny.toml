# cargo-deny configuration.
#
# Run locally:  (cd src-tauri && cargo deny check)
# CI runs:      cargo deny check advisories bans licenses sources

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Vulnerability advisories (RustSec).
# ---------------------------------------------------------------------------
[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Real CVEs (`vulnerability`) always fail. `unmaintained = "workspace"`
# downgrades transitive unmaintained advisories to warnings — those are
# upstream's problem (e.g. Tauri's transitives like urlpattern → unic-*,
# gtk-rs GTK3 bindings) and we have no patch path. A direct workspace
# dep going unmaintained still errors, because we *can* act on that.
unmaintained = "workspace"
# Add advisory IDs here only after reading the advisory and recording why
# the project is not affected. Example:
#   { id = "RUSTSEC-2024-0001", reason = "not exercised; <link to analysis>" }
ignore = [
  # quick-xml 0.39.4 DoS advisories (both untrusted-XML denial-of-service):
  # 0194 = O(N^2) duplicate-attribute check, 0195 = unbounded namespace-decl
  # allocation in NsReader. quick-xml is pulled in ONLY transitively via
  # plist (tauri -> plist -> quick-xml ^0.39.2), which Tauri uses at BUILD
  # TIME to generate our own Info.plist on Apple platforms. We never parse
  # untrusted XML at runtime, so there is no attack surface. No upstream fix
  # path exists: plist 1.9.0 (latest, Apr 2026) still pins quick-xml ^0.39.2,
  # so quick-xml cannot move to the patched >=0.41.0 until plist (then tauri)
  # release updates. Re-run `cargo tree -i quick-xml` when bumping Tauri and
  # drop these once quick-xml resolves to >=0.41.0.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml DoS; build-time-only via plist, untrusted XML never parsed at runtime; no upstream fix path (plist 1.9.0 pins quick-xml ^0.39.2). https://rustsec.org/advisories/RUSTSEC-2026-0194" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml DoS; build-time-only via plist, untrusted XML never parsed at runtime; no upstream fix path (plist 1.9.0 pins quick-xml ^0.39.2). https://rustsec.org/advisories/RUSTSEC-2026-0195" },
]

# ---------------------------------------------------------------------------
# Licenses. The project ships as AGPL-3.0-or-later, so dependency licenses
# must be AGPL-compatible. This allowlist is the common set in the Rust /
# Tauri ecosystem; extend it deliberately, not reflexively.
# ---------------------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  # Our own crate.
  "AGPL-3.0-or-later",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unlicense",
  "CC0-1.0",
  "Zlib",
  "MPL-2.0",
  "BSL-1.0",
  "0BSD",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  # Mozilla's certificate roots data ship under CDLA-Permissive-2.0
  # (used by webpki-roots via reqwest). Permissive data license, AGPL-OK.
  "CDLA-Permissive-2.0",
  # NOTE: SPDX `OpenSSL` (old OpenSSL + SSLeay dual license) is
  # AGPL-incompatible due to the advertising clause. Do not add it
  # back. Modern OpenSSL (3.0+) ships as Apache-2.0, already allowed.
]
# Per-crate license clarifications go here when SPDX detection fails.
exceptions = []

# ---------------------------------------------------------------------------
# Banned crates and duplicate-version warnings.
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Source registries. Default to crates.io only.
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
