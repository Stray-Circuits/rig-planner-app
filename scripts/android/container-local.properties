# Container-only override of src-tauri/gen/android/local.properties.
#
# build.sh mounts this on top of the host file (read-only) so the container's
# Gradle finds the SDK at the image's path instead of the host's macOS sdk.dir
# (which doesn't exist inside the Linux container). The host file stays
# untouched. ANDROID_HOME is preset to /opt/android-sdk-linux by the base image.
sdk.dir=/opt/android-sdk-linux
